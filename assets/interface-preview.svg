<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft window shadow -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <!-- Dropdown shadow -->
    <filter id="menuShadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <!-- Chip shadow -->
    <filter id="chipShadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- WINDOW CONTAINER -->
  <g filter="url(#winShadow)">
    <rect x="20" y="20" width="900" height="440" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="1.2" />
  </g>

  <!-- WINDOW TITLE BAR (Windows 11 style) -->
  <path d="M 21 21 Q 21 34 34 34 L 906 34 Q 919 34 919 21 Z" fill="#f8fafd" />
  <rect x="20" y="20" width="900" height="34" rx="14" fill="#f8fafd" />
  <!-- Re-fill lower titlebar corners so they stay square -->
  <rect x="20" y="38" width="900" height="16" fill="#f8fafd" />
  <line x1="20" y1="54" x2="920" y2="54" stroke="#e8eaed" stroke-width="1" />

  <!-- Window controls -->
  <g transform="translate(850, 32)">
    <line x1="0" y1="5" x2="10" y2="5" stroke="#5f6368" stroke-width="1.2" />
    <rect x="24" y="0" width="10" height="10" fill="none" stroke="#5f6368" stroke-width="1.2" />
    <line x1="48" y1="0" x2="58" y2="10" stroke="#5f6368" stroke-width="1.2" />
    <line x1="58" y1="0" x2="48" y2="10" stroke="#5f6368" stroke-width="1.2" />
  </g>
  <text x="42" y="38" font-size="12" fill="#5f6368" font-weight="500">🎓 AcademiCal Desktop — Google Calendar</text>

  <!-- GOOGLE CALENDAR MAIN HEADER (Y: 54 to 118) -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="900" height="64" fill="#ffffff" />
    <line x1="0" y1="64" x2="900" y2="64" stroke="#dadce0" stroke-width="1" />

    <!-- Left: Hamburger & Calendar Branding -->
    <g transform="translate(18, 22)">
      <!-- Hamburger -->
      <line x1="0" y1="3" x2="18" y2="3" stroke="#5f6368" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="9" x2="18" y2="9" stroke="#5f6368" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="15" x2="18" y2="15" stroke="#5f6368" stroke-width="2" stroke-linecap="round" />

      <!-- Calendar Icon -->
      <rect x="32" y="0" width="22" height="22" rx="4" fill="#1a73e8" />
      <rect x="35" y="6" width="16" height="13" rx="2" fill="#ffffff" />
      <text x="43" y="17" font-size="9" font-weight="bold" fill="#1a73e8" text-anchor="middle">18</text>
      <!-- Title -->
      <text x="62" y="17" font-size="18" font-weight="500" fill="#3c4043" letter-spacing="-0.3">Calendar</text>
    </g>

    <!-- Navigation: Hoy, Arrows, Month -->
    <g transform="translate(185, 18)">
      <rect x="0" y="0" width="56" height="30" rx="4" fill="#ffffff" stroke="#dadce0" stroke-width="1" />
      <text x="28" y="19" font-size="13" font-weight="600" fill="#3c4043" text-anchor="middle">Hoy</text>
      <!-- Nav arrows -->
      <text x="74" y="21" font-size="16" fill="#5f6368" cursor="pointer">‹</text>
      <text x="94" y="21" font-size="16" fill="#5f6368" cursor="pointer">›</text>
      <!-- Month -->
      <text x="124" y="20" font-size="16" font-weight="500" fill="#3c4043">Octubre 2026</text>
    </g>

    <!-- INJECTED ACADEMIC TABS CAPSULE (CENTER-LEFT) -->
    <g transform="translate(390, 15)">
      <!-- Capsule background -->
      <rect x="0" y="0" width="310" height="36" rx="18" fill="#f1f3f4" stroke="#dadce0" stroke-width="1" />
      
      <!-- Tab 1: [1 CLASES] (Active) -->
      <rect x="3" y="3" width="94" height="30" rx="15" fill="#1a73e8" />
      <text x="50" y="22" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">🎓 1 CLASES</text>

      <!-- Tab 2: [2 EXÁMENES] -->
      <text x="160" y="22" font-size="11.5" font-weight="600" fill="#5f6368" text-anchor="middle">2 EXÁMENES</text>

      <!-- Tab 3: [3 TODO] -->
      <text x="260" y="22" font-size="11.5" font-weight="600" fill="#5f6368" text-anchor="middle">3 TODO</text>
    </g>

    <!-- Right Cluster: Search, Gear and Profile -->
    <g transform="translate(720, 16)">
      <!-- Search pill -->
      <rect x="0" y="0" width="100" height="34" rx="17" fill="#f1f3f4" stroke="none" />
      <text x="14" y="21" font-size="13" fill="#5f6368">🔍</text>
      <text x="34" y="21" font-size="11.5" fill="#5f6368">Buscar</text>

      <!-- Native Gear Button (Active / Clicked State) -->
      <g transform="translate(112, 0)">
        <circle cx="17" cy="17" r="17" fill="#e8f0fe" />
        <text x="17" y="23" font-size="16" text-anchor="middle">⚙️</text>
      </g>

      <!-- Avatar -->
      <circle cx="158" cy="17" r="15" fill="#7c3aed" />
      <text x="158" y="22" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
    </g>
  </g>

  <!-- BODY CONTENT: SIDEBAR + CALENDAR WEEKLY GRID -->
  <g transform="translate(20, 118)">
    <!-- Sidebar (left: 0 to 180) -->
    <rect x="0" y="0" width="180" height="320" fill="#ffffff" />
    <line x1="180" y1="0" x2="180" y2="320" stroke="#dadce0" stroke-width="1" />

    <!-- Create button -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="120" height="40" rx="20" fill="#ffffff" stroke="#dadce0" stroke-width="1" />
      <text x="22" y="25" font-size="18" fill="#ea4335" font-weight="bold">+</text>
      <text x="44" y="25" font-size="13" font-weight="600" fill="#3c4043">Crear</text>
    </g>

    <!-- Sidebar Calendars list -->
    <g transform="translate(18, 76)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#5f6368" letter-spacing="0.5">MIS ASIGNATURAS</text>

      <!-- Cal 1 -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#B69A31" />
        <text x="20" y="10" font-size="11.5" fill="#3c4043" font-weight="500">Computadores</text>
      </g>
      <!-- Cal 2 -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#90B0C4" />
        <text x="20" y="10" font-size="11.5" fill="#3c4043" font-weight="500">Programación I</text>
      </g>
      <!-- Cal 3 -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#96BCBB" />
        <text x="20" y="10" font-size="11.5" fill="#3c4043" font-weight="500">Economía</text>
      </g>
      <!-- Cal 4 -->
      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#C2842D" />
        <text x="20" y="10" font-size="11.5" fill="#3c4043" font-weight="500">Derecho</text>
      </g>
      <!-- Cal 5 -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#BAB35A" />
        <text x="20" y="10" font-size="11.5" fill="#3c4043" font-weight="500">Matemáticas I</text>
      </g>
    </g>

    <!-- CALENDAR GRID COLUMNS (180 to 900 -> 720px width across 5 days) -->
    <g transform="translate(180, 0)">
      <!-- Day Headers (width: 144px per day) -->
      <!-- Mon -->
      <text x="72" y="22" font-size="11" font-weight="600" fill="#70757a" text-anchor="middle">LUN</text>
      <text x="72" y="40" font-size="18" font-weight="500" fill="#3c4043" text-anchor="middle">19</text>
      <!-- Tue -->
      <text x="216" y="22" font-size="11" font-weight="600" fill="#70757a" text-anchor="middle">MAR</text>
      <text x="216" y="40" font-size="18" font-weight="500" fill="#3c4043" text-anchor="middle">20</text>
      <!-- Wed (Today) -->
      <circle cx="360" cy="35" r="15" fill="#1a73e8" />
      <text x="360" y="22" font-size="11" font-weight="700" fill="#1a73e8" text-anchor="middle">MIÉ</text>
      <text x="360" y="40" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">21</text>
      <!-- Thu -->
      <text x="504" y="22" font-size="11" font-weight="600" fill="#70757a" text-anchor="middle">JUE</text>
      <text x="504" y="40" font-size="18" font-weight="500" fill="#3c4043" text-anchor="middle">22</text>
      <!-- Fri -->
      <text x="648" y="22" font-size="11" font-weight="600" fill="#70757a" text-anchor="middle">VIE</text>
      <text x="648" y="40" font-size="18" font-weight="500" fill="#3c4043" text-anchor="middle">23</text>

      <!-- Grid lines -->
      <line x1="0" y1="52" x2="720" y2="52" stroke="#dadce0" stroke-width="1" />
      <line x1="144" y1="0" x2="144" y2="320" stroke="#f1f3f4" stroke-width="1" />
      <line x1="288" y1="0" x2="288" y2="320" stroke="#f1f3f4" stroke-width="1" />
      <line x1="432" y1="0" x2="432" y2="320" stroke="#f1f3f4" stroke-width="1" />
      <line x1="576" y1="0" x2="576" y2="320" stroke="#f1f3f4" stroke-width="1" />

      <!-- Time slot lines -->
      <line x1="0" y1="120" x2="720" y2="120" stroke="#f8f9fa" stroke-width="1" />
      <line x1="0" y1="190" x2="720" y2="190" stroke="#f8f9fa" stroke-width="1" />
      <line x1="0" y1="260" x2="720" y2="260" stroke="#f8f9fa" stroke-width="1" />

      <!-- CHIP 1: EXAMEN BADGE PRO (Wed 21, 10:00) -->
      <g transform="translate(294, 75)" filter="url(#chipShadow)">
        <rect x="0" y="0" width="132" height="88" rx="8" fill="#FFFDF5" stroke="#B69A31" stroke-width="1.4" />
        <!-- Gold left border accent -->
        <path d="M 0 8 Q 0 0 8 0 L 10 0 L 10 88 L 8 88 Q 0 88 0 80 Z" fill="#B69A31" />

        <g transform="translate(16, 12)">
          <!-- Pill Badge -->
          <rect x="0" y="0" width="70" height="16" rx="4" fill="#B69A31" />
          <text x="35" y="11.5" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">📋 EXAMEN</text>
          <!-- Time -->
          <text x="104" y="11.5" font-size="9" font-weight="600" fill="#78350F" text-anchor="end">10:00</text>
          
          <!-- Subject -->
          <text x="0" y="32" font-size="10.5" font-weight="700" fill="#78350F">Computadores</text>
          <!-- Title -->
          <text x="0" y="47" font-size="11.5" font-weight="bold" fill="#451A03">Parcial Tema 1-4</text>
          <!-- Room -->
          <text x="0" y="62" font-size="9.5" fill="#92400E">📍 Aula Magna 2.1</text>
        </g>
      </g>

      <!-- CHIP 2: ENTREGA BADGE PRO (Fri 23, 16:00) -->
      <g transform="translate(582, 130)" filter="url(#chipShadow)">
        <rect x="0" y="0" width="130" height="82" rx="8" fill="#F4F8FA" stroke="#90B0C4" stroke-width="1.4" />
        <path d="M 0 8 Q 0 0 8 0 L 8 0 L 8 82 L 8 82 Q 0 82 0 74 Z" fill="#90B0C4" />

        <g transform="translate(14, 12)">
          <rect x="0" y="0" width="74" height="16" rx="4" fill="#90B0C4" />
          <text x="37" y="11.5" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">🗓️ ENTREGA</text>
          
          <text x="0" y="32" font-size="10" font-weight="700" fill="#1E3A5F">Programación I</text>
          <text x="0" y="46" font-size="11" font-weight="bold" fill="#0F172A">Práctica Árboles</text>
          <text x="0" y="60" font-size="9.5" fill="#334155">⏱️ 23:59 Límite</text>
        </g>
      </g>

      <!-- CHIP 3: COMPLETED ENTREGA (Tue 20) -->
      <g transform="translate(150, 150)" opacity="0.6">
        <rect x="0" y="0" width="130" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <g transform="translate(12, 12)">
          <rect x="0" y="0" width="60" height="15" rx="3" fill="#1e7e34" />
          <text x="30" y="11" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ HECHA</text>
          <text x="0" y="30" font-size="10.5" fill="#64748b" text-decoration="line-through">Entrega Álgebra</text>
        </g>
      </g>
    </g>
  </g>

  <!-- NATIVE GEAR POPUP DROPDOWN (FLOATING OVER THE GRID) -->
  <g transform="translate(680, 110)" filter="url(#menuShadow)">
    <rect x="0" y="0" width="220" height="152" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1" />

    <!-- Google Item 1: Configuración -->
    <g transform="translate(0, 8)">
      <rect x="4" y="0" width="212" height="32" rx="6" fill="transparent" />
      <text x="16" y="21" font-size="13" fill="#3c4043">Configuración</text>
    </g>

    <!-- CUSTOM ITEM 2: 🎓 AJUSTES DE CURSO (HIGHLIGHTED ACADEMICAL FEATURE) -->
    <g transform="translate(0, 42)">
      <rect x="4" y="0" width="212" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="0.8" />
      <text x="14" y="23" font-size="13.5" font-weight="700" fill="#1a73e8">🎓 Ajustes de Curso</text>
      <!-- Ctrl+, badge -->
      <rect x="156" y="8" width="50" height="18" rx="4" fill="#d2e3fc" />
      <text x="181" y="21" font-size="10" font-weight="bold" fill="#174ea6" text-anchor="middle">Ctrl+,</text>
    </g>

    <!-- Divider -->
    <line x1="8" y1="84" x2="212" y2="84" stroke="#f1f3f4" stroke-width="1" />

    <!-- Google Item 3: Papelera -->
    <g transform="translate(0, 88)">
      <text x="16" y="20" font-size="13" fill="#5f6368">Papelera</text>
    </g>

    <!-- Google Item 4: Densidad y color -->
    <g transform="translate(0, 118)">
      <text x="16" y="20" font-size="13" fill="#5f6368">Densidad y color</text>
    </g>
  </g>

  <!-- CALLOUT ARROW & BADGE POINTING TO THE GEAR INTEGRATION -->
  <g transform="translate(560, 82)">
    <rect x="0" y="0" width="112" height="24" rx="12" fill="#1a73e8" />
    <text x="56" y="16" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Integrado en ⚙️ ➔</text>
  </g>
</svg>
